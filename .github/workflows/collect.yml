name: Collect and publish

on:
  schedule:
    # Every 4 hours at :17 UTC (08:17, 12:17 … Singapore). Off the hour to avoid GitHub's peak-time delays.
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      AI_NEWS_NETWORK: direct
      AI_NEWS_DATA_ROOT: ${{ github.workspace }}/state
      AI_NEWS_BACKUP_ROOT: /tmp/board-backups
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests
        env:
          AI_NEWS_DATA_ROOT: ${{ runner.temp }}/test-data
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node tests/test_heat.cjs
          git checkout -- site

      - name: Restore stored data (state branch)
        id: restore
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch --depth=1 origin state
            git archive FETCH_HEAD | tar -x -C state
          else
            echo "No state branch yet; starting with an empty database."
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi
          printf '{"enabled": true, "intervalHours": 4, "runner": "github-actions", "timezone": "Asia/Singapore"}\n' > state/schedule.json

      - name: Collect sources
        id: collect
        if: github.event_name != 'push' || steps.restore.outputs.fresh == 'true'
        continue-on-error: true
        run: python scripts/run_board_collection.py

      - name: Rebuild page data only (code push)
        if: github.event_name == 'push' && steps.restore.outputs.fresh != 'true'
        run: python scripts/build_site_data.py

      - name: Keep raw responses as a 7-day artifact
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && (github.event_name != 'push' || steps.restore.outputs.fresh == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: |
            state/board-runs
            state/media-runs
            state/scheduled-runs
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep database backup as a 7-day artifact
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && (github.event_name != 'push' || steps.restore.outputs.fresh == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: /tmp/board-backups
          retention-days: 7
          if-no-files-found: ignore

      - name: Save stored data (state branch, single commit)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && (github.event_name != 'push' || steps.restore.outputs.fresh == 'true') }}
        working-directory: state
        run: |
          rm -rf board-runs media-runs collection.lock
          # Keep 7 days of run reports (6 per day) for the freshness check on the page.
          if [ -d scheduled-runs ]; then ls -1 scheduled-runs/*.json 2>/dev/null | sort | head -n -42 | xargs -r rm -f; fi
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q --orphan state
          git add -A
          git commit -q --allow-empty -m "State after run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:state

      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        with:
          path: site

      - id: deploy
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        uses: actions/deploy-pages@v4

      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Collection failed. The page was still published with the last good data; see the run report in the raw artifact."
          exit 1
